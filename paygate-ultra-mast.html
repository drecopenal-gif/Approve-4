        @keyframes cardEnter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

        .glass{

          border:1px solid rgba(255,255,255,0.08);

        .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
        .logo{

          display:grid;place-items:center;
          box-shadow:0 0 0 1px rgba(16,185,129,0.4) inset, 0 8px 24px rgba(16,185,129,0.4), 0 0 40px rgba(16,185,129,0.25);

        .logo::after{
          content:"";position:absolute;inset:0;

          transform:translateX(-100%);animation:shineMove 3.2s ease-in-out infinite;
        }
        @keyframes shineMove{0%{transform:translateX(-120%)} 55%{transform:translateX(120%)} 100%{transform:translateX(120%)}}
        .brand h1{font-family:"Space Grotesk";font-size:1.18rem;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
        .brand h1 span{background:linear-gradient(90deg, #6ee7b7, #22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
        .brand p{font-size:0.72rem;color:#8b9bb4;font-weight:600;letter-spacing:0.04em;margin-top:2px}
        .live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);padding:5px 10px;border-radius:999px;font-size:0.68rem;font-weight:800;color:#6ee7b7;letter-spacing:0.06em}

        .pulse-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 0 rgba(16,185,129,0.6);animation:pulseDot 2s infinite;margin-left:10px}
        @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(16,185,129,0.6)}70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

        .qr-outer{position:relative;width:242px;height:242px;margin:0 auto 18px}
        .qr-border{
          position:absolute;inset:-2px;border-radius:22px;

        }
        @keyframes rotateBorder{to{transform:rotate(360deg)}}
        .qr-shell{
          position:relative;z-index:1;

        }
        @keyframes scanMove{0%{top:18%}50%{top:82%}100%{top:18%}}

        .guide{
